<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=360,initial-scale=1">
<title>Finzz report</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&display=block" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<style>
/* page-local: ReportPreviewScreen chrome (SafeAreaWrapper bottom inset 24) */
.screen{display:flex;flex-direction:column;padding-bottom:24px}
.rp-header{display:flex;align-items:center;padding:10px 12px;background:var(--surface);border-bottom:.33px solid var(--border)}
.rp-back{padding:6px;margin-right:8px;display:flex}
.rp-title{font-size:var(--fs-lg);font-weight:700;color:var(--text);line-height:20px}
.rp-sub{font-size:var(--fs-sm);color:var(--text-secondary);margin-top:1px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp-body{flex:1;background:#F1F5F9;position:relative;overflow:hidden}
.rp-body iframe{position:absolute;top:0;left:0;width:360px;height:100%;border:0;background:#F1F5F9}
.rp-bar{display:flex;gap:12px;padding:12px 16px;background:var(--surface);border-top:.33px solid var(--border)}
.rp-btn{flex:1;height:48px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r-md);font-size:var(--fs-md);font-weight:600}
.rp-btn i{font-size:20px}
.rp-btn.fill{background:var(--primary);color:var(--text-inverse)}
.rp-btn.out{background:var(--surface);border:1.5px solid var(--primary);color:var(--primary)}
</style>
</head><body>
<div id="statusbar"></div>
<main class="screen no-tabs">
  <div class="rp-header">
    <div class="rp-back"><i data-ion="arrow-back" style="font-size:24px;color:var(--text)"></i></div>
    <div style="flex:1;min-width:0">
      <div class="rp-title">Report</div>
      <div class="rp-sub">November 2026 · Rohan Mehta</div>
    </div>
  </div>
  <div class="rp-body"><iframe src="report-demo.html" scrolling="no"></iframe></div>
  <div class="rp-bar">
    <div class="rp-btn fill"><i data-ion="share-outline"></i><span>Share PDF</span></div>
    <div class="rp-btn out"><i data-ion="print-outline"></i><span>Print</span></div>
  </div>
</main>
<div class="gesture-pill"></div>
<script src="icons.js"></script><script src="kit.js"></script>
</body></html>
