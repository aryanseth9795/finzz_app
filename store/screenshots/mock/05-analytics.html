<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=360,initial-scale=1">
<title>Finzz analytics</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&display=block" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<style>
/* page-local: ExpenseStatsScreen (header, MonthSelector, HeroSection, PaceSection) */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.hdr .ib{width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.hdr .t{font-size:var(--fs-lg);font-weight:var(--fw-bold);color:var(--text)}
.ms{display:flex;align-items:center;background:var(--surface);border:.5px solid var(--border);border-radius:var(--r-lg);margin:8px 16px;padding:4px}
.ms .arrow{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-md)}
.ms .arrow.dis{opacity:.3}
.ms .center{flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;gap:8px}
.ms .ct{display:flex;flex-direction:column;align-items:center}
.ms .lbl{font-size:var(--fs-lg);font-weight:600;color:var(--text)}
.ms .cap{font-size:var(--fs-xs);color:var(--text-secondary);margin-top:1px}
.body{padding:16px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px}
.row{display:flex;align-items:center}
.dot{width:10px;height:10px;border-radius:5px;flex:none}
.chip{display:inline-flex;align-items:center;gap:2px;padding:2px 6px;border-radius:999px;font-size:var(--fs-xs);font-weight:700}
.chip i{font-size:11px}
.sh b{display:block;font-size:var(--fs-lg);font-weight:var(--fw-bold);color:var(--text)}
.legend{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:var(--fs-xs);color:var(--text-secondary)}
.legend .it{display:flex;align-items:center;gap:6px}
.dashes{display:flex;gap:2px}.dashes span{width:5px;height:2px;border-radius:1px}
svg{display:block}
</style>
</head><body>
<div id="statusbar"></div>
<main class="screen">
  <div class="hdr">
    <div class="ib"><i data-ion="arrow-back" style="font-size:24px;color:var(--text)"></i></div>
    <div class="t">Analytics</div>
    <div class="ib"><i data-ion="download-outline" style="font-size:22px;color:var(--primary)"></i></div>
  </div>
  <div class="ms">
    <div class="arrow"><i data-ion="chevron-back" style="font-size:22px;color:var(--text)"></i></div>
    <div class="center">
      <i data-ion="calendar-outline" style="font-size:20px;color:var(--primary)"></i>
      <div class="ct"><span class="lbl">November 2026</span><span class="cap">19 transactions</span></div>
      <i data-ion="chevron-down" style="font-size:16px;color:var(--text-secondary)"></i>
    </div>
    <div class="arrow dis"><i data-ion="chevron-forward" style="font-size:22px;color:var(--text)"></i></div>
  </div>
  <div class="body" id="body"></div>
</main>
<nav id="tabbar" data-active="Expenses"></nav>
<script src="icons.js"></script><script src="kit.js"></script>
<script>
(function(){
  var inr=Finzz.inr, css=function(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()};
  // ---- helpers ported from src/components/charts/scale.ts ----
  function lin(d,r){var d0=d[0],d1=d[1],r0=r[0],r1=r[1];if(d0===d1){var m=(r0+r1)/2;return function(){return m}}var k=(r1-r0)/(d1-d0);return function(x){return r0+(x-d0)*k}}
  var NS=[1,1.5,2,2.5,3,4,5,6,8,10];
  function niceMax(n){if(!(n>0))return 1;var mag=Math.pow(10,Math.floor(Math.log10(n))),m=n/mag;for(var i=0;i<NS.length;i++)if(m<=NS[i]+1e-9)return NS[i]*mag;return 10*mag}
  function num(n){return String(Number(n.toFixed(2)))}
  function pt(p){return num(p.x)+","+num(p.y)}
  function linePath(a){return a.map(function(p,i){return(i?"L":"M")+pt(p)}).join("")}
  function smooth(P){var n=P.length;if(!n)return"";if(n==1)return"M"+pt(P[0]);if(n==2)return linePath(P);
    var h=[],d=[];for(var i=0;i<n-1;i++){var dx=P[i+1].x-P[i].x;h.push(dx);d.push(dx===0?0:(P[i+1].y-P[i].y)/dx)}
    var m=new Array(n).fill(0);m[0]=d[0];m[n-1]=d[n-2];
    for(i=1;i<n-1;i++)m[i]=d[i-1]*d[i]<=0?0:(d[i-1]+d[i])/2;
    for(i=0;i<n-1;i++){if(d[i]===0){m[i]=0;m[i+1]=0;continue}var a=m[i]/d[i],b=m[i+1]/d[i],s=a*a+b*b;if(s>9){var t=3/Math.sqrt(s);m[i]=t*a*d[i];m[i+1]=t*b*d[i]}}
    var out="M"+pt(P[0]);for(i=0;i<n-1;i++){var p0=P[i],p1=P[i+1];out+="C"+pt({x:p0.x+h[i]/3,y:p0.y+m[i]*h[i]/3})+","+pt({x:p1.x-h[i]/3,y:p1.y-m[i+1]*h[i]/3})+","+pt(p1)}return out}
  function areaPath(P,by){var f=P[0],l=P[P.length-1];return"M"+num(f.x)+","+num(by)+"L"+smooth(P).slice(1)+"L"+num(l.x)+","+num(by)+"Z"}
  function trim1(v){return String(Number(v.toFixed(1)))}
  function axis(n){var v=Math.abs(n),body;if(v<1000)body=String(Math.round(v));else{var u,val;if(v<1e5){u="K";val=v/1e3}else if(v<1e7){u="L";val=v/1e5}else{u="Cr";val=v/1e7}body=trim1(val)+u}return body==="0"?"₹0":"₹"+body}

  // ---- demo data (DEMO.md) ----
  var today=13, dim=30;
  var daily={1:4250,2:500,3:999,4:460,5:1899,6:599,7:320,8:1330,9:1251,10:942,11:440,12:550,13:0};
  var run=0, series=[]; for(var d=1;d<=today;d++){run+=(daily[d]||0);series.push(run)}
  var spend=run; // 13,540
  var income=45000, net=income-spend, sRate=net/income*100; // Salary on the 1st (page-local per master ruling)
  var trend=[{d:19900,c:45000},{d:25000,c:45000},{d:13540,c:45000}]; // Sep, Oct, Nov (months with rows)
  var avg=(19900+25000)/2, avgMonths=2;                    // Aug has no rows
  // monthOverMonth (previous month pro-rated to days elapsed)
  var prevScaled=25000*today/31, mom=(spend-prevScaled)/prevScaled*100;
  var prevInc=45000*today/31, momInc=(income-prevInc)/prevInc*100;
  // projectMonthEnd (>= 7 days elapsed, average exists)
  var left=dim-today, avgRate=avg/dim, recent=spend/today, w=today/dim, rate=w*recent+(1-w)*avgRate;
  var proj=Math.round((spend+rate*left)*100)/100;
  var diff=(proj-avg)/Math.abs(avg)*100;

  // ---- Sparkline (72x30) ----
  function spark(data,color){var W=72,H=30,PAD=3,mn=Math.min.apply(0,data),mx=Math.max.apply(0,data);
    var sx=lin([0,Math.max(data.length-1,1)],[PAD,W-PAD]),sy=lin([mn,mx],[H-PAD,PAD]);
    var P=data.map(function(v,i){return{x:sx(i),y:sy(v)}}),l=P[P.length-1];
    return '<svg width="72" height="30" style="flex:none"><path d="'+smooth(P)+'" stroke="'+color+'" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="'+l.x+'" cy="'+l.y+'" r="2.5" fill="'+color+'"/></svg>'}

  // ---- ProgressRing (104, 11): value 0 (no income) so only the track shows ----
  var RS=104,circ=2*Math.PI*((104-11)/2),RT=11,rc=RS/2,rr=(RS-RT)/2;
  var ring='<svg width="104" height="104"><circle cx="'+rc+'" cy="'+rc+'" r="'+rr+'" stroke="'+css("--chart-track")+'" stroke-width="'+RT+'" fill="none"/><circle cx="'+rc+'" cy="'+rc+'" r="'+rr+'" stroke="'+css("--chart-positive")+'" stroke-width="'+RT+'" stroke-linecap="round" fill="none" stroke-dasharray="'+circ+' '+circ+'" stroke-dashoffset="'+circ*(1-sRate/100)+'" transform="rotate(-90 '+rc+' '+rc+')"/></svg>'+
    '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 12px"><span style="font-size:17px;font-weight:700;color:var(--text)">'+Math.round(sRate)+'%</span><span style="font-size:11px;color:var(--text-secondary)">saved</span></div>';

  // ---- HeroFigure ----
  var neg=css("--chart-negative"),pos=css("--chart-positive");
  function chip(change,good){if(change===null||Math.round(Math.abs(change))<1)return"";
    return '<span class="chip" style="background:'+(good?pos:neg)+'24;color:'+(good?pos:neg)+'"><i data-ion="arrow-up" style="color:'+(good?pos:neg)+'"></i>'+Math.round(Math.abs(change))+'%</span>'}
  function fig(label,amt,color,sp,ch){return '<div class="row" style="justify-content:space-between"><div style="flex:1;min-width:0"><div class="row" style="gap:8px"><span class="dot" style="background:'+color+'"></span><span style="font-size:13px;color:var(--text-secondary)">'+label+'</span>'+ch+'</div><div style="font-size:20px;font-weight:700;color:var(--text);margin-top:2px;white-space:nowrap">'+inr(amt)+'</div></div>'+sp+'</div>'}
  var hero='<div class="card"><div style="font-size:13px;color:var(--text-secondary)">November 2026</div>'+
    '<div style="font-size:32px;font-weight:800;color:var(--text);margin-top:2px;white-space:nowrap;color:'+pos+'">Saved '+inr(net)+'</div>'+
    '<div class="row" style="margin-top:20px;gap:20px"><div style="position:relative;width:104px;height:104px;flex:none">'+ring+'</div>'+
    '<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:16px">'+
      fig("Spent",spend,css("--chart-spend"),spark(trend.map(function(t){return t.d}),css("--chart-spend")),chip(mom,false))+
      fig("Received",income,css("--chart-income"),spark(trend.map(function(t){return t.c}),css("--chart-income")),chip(momInc,true))+
    '</div></div>'+
    '</div>';

  // ---- AreaLineChart (294x190) ----
  var W=294,H=190,PL=44,PR=10,PT=12,PB=22,plotW=W-PL-PR,plotH=H-PT-PB,total=dim;
  var cmp=new Array(dim).fill(avg);
  var top=niceMax(Math.max.apply(0,series.concat(cmp,[proj])));
  var sx=lin([0,total-1],[PL,PL+plotW]),sy=lin([0,top],[PT+plotH,PT]),baseY=PT+plotH;
  function toPts(a){return a.map(function(v,i){return{x:sx(i),y:sy(v)}})}
  var pts=toPts(series),last=pts[pts.length-1],cpts=toPts(cmp);
  var grid=css("--chart-grid"),ax=css("--chart-axis"),sp=css("--chart-spend");
  var s='<svg width="'+W+'" height="'+H+'"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+sp+'" stop-opacity=".28"/><stop offset="1" stop-color="'+sp+'" stop-opacity="0"/></linearGradient></defs>';
  [1,2,3].forEach(function(i){var v=top*i/3;s+='<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+sy(v)+'" y2="'+sy(v)+'" stroke="'+grid+'"/><text x="'+(PL-6)+'" y="'+(sy(v)+3)+'" font-size="10" fill="'+ax+'" text-anchor="end">'+axis(v)+'</text>'});
  s+='<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+baseY+'" y2="'+baseY+'" stroke="'+grid+'"/><text x="'+(PL-6)+'" y="'+(baseY+3)+'" font-size="10" fill="'+ax+'" text-anchor="end">₹0</text>';
  [1,8,15,22,30].forEach(function(day){var i=day-1,an=i===0?"start":i===total-1?"end":"middle";s+='<text x="'+sx(i)+'" y="'+(H-6)+'" font-size="10" fill="'+ax+'" text-anchor="'+an+'">'+day+'</text>'});
  s+='<path d="'+smooth(cpts)+'" stroke="'+ax+'" stroke-width="1.25" stroke-dasharray="4 4" stroke-opacity=".8" fill="none"/>';
  s+='<path d="'+areaPath(pts,baseY)+'" fill="url(#g)"/><path d="'+smooth(pts)+'" stroke="'+sp+'" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" fill="none"/>';
  s+='<path d="'+linePath([last,{x:sx(total-1),y:sy(proj)}])+'" stroke="'+sp+'" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round" stroke-opacity=".7" fill="none"/>';
  s+='<circle cx="'+last.x+'" cy="'+last.y+'" r="3.5" fill="'+sp+'"/></svg>';

  var dAbs=Math.round(Math.abs(diff)), tint=diff>0?neg:css("--chart-positive");
  function dash(c){return '<span class="dashes"><span style="background:'+c+'"></span><span style="background:'+c+'"></span><span style="background:'+c+'"></span></span>'}
  var pace='<div class="card"><div class="sh" style="margin-bottom:12px"><b>Pace</b></div>'+
    '<div style="font-size:24px;font-weight:800;color:var(--text);white-space:nowrap">On pace for '+inr(proj)+'</div>'+
    '<div style="font-size:13px;font-weight:500;color:'+tint+';margin-top:2px;margin-bottom:12px">'+dAbs+'% '+(diff>0?"above":"below")+' your '+avgMonths+'-month average of '+inr(avg)+'</div>'+s+
    '<div class="legend"><span class="it"><span class="dot" style="background:'+sp+'"></span>Spent so far</span><span class="it">'+dash(ax)+avgMonths+'-mo avg</span><span class="it">'+dash(sp)+'Projected</span></div></div>';

  document.getElementById("body").innerHTML=hero+pace;
  Finzz.icons(document.getElementById("body"));
})();
</script>
</body></html>
