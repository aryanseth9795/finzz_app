<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=360,initial-scale=1">
<title>Pools</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&display=block" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<style>
.hdr{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:.5px solid var(--separator)}
.hdr h1{font-size:var(--fs-xxl);font-weight:700;letter-spacing:-.5px;color:var(--text)}
.list{padding:16px}
.pc{display:flex;align-items:center;padding:14px;border-radius:12px;margin-bottom:12px;gap:12px;background:var(--surface)}
.pi{width:52px;height:52px;border-radius:26px;background:var(--primary-surface);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;color:var(--primary);flex:none}
.info{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.ph{display:flex;align-items:center;gap:8px}
.pn{font-size:var(--fs-lg);font-weight:600;flex:1;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{padding:3px 8px;border-radius:6px;background:color-mix(in srgb,var(--primary) 12.5%,transparent);color:var(--primary);font-size:var(--fs-xs);font-weight:700;letter-spacing:.3px}
.lt{font-size:var(--fs-sm);font-weight:400;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;align-items:center;gap:4px;color:var(--text-tertiary);font-size:var(--fs-xs);font-weight:500}
.fab{position:absolute;bottom:24px;right:24px;width:56px;height:56px;border-radius:28px;background:var(--primary);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px var(--shadow);color:var(--bubble-text-sent)}
</style></head><body>
<div id="statusbar"></div>
<main class="screen">
<div class="hdr"><h1>Pools</h1><span class="avatar" data-name="Aarav Kapoor" data-size="40"></span></div>
<div class="list">
<div class="pc"><div class="pi">G</div><div class="info"><div class="ph"><span class="pn">Goa Trip</span><span class="badge">ACTIVE</span></div><div class="lt">₹9000 • Villa booking</div><div class="meta"><i data-ion="people-outline" style="font-size:14px"></i><span>4 members</span></div></div><i data-ion="chevron-forward" style="font-size:20px;color:var(--text-tertiary)"></i></div>
<div class="pc"><div class="pi">F</div><div class="info"><div class="ph"><span class="pn">Flat 302</span><span class="badge">ACTIVE</span></div><div class="lt">₹1850 • Electricity bill</div><div class="meta"><i data-ion="people-outline" style="font-size:14px"></i><span>3 members</span></div></div><i data-ion="chevron-forward" style="font-size:20px;color:var(--text-tertiary)"></i></div>
</div>
<div class="fab"><i data-ion="add" style="font-size:28px"></i></div>
</main>
<nav id="tabbar" data-active="Pool"></nav>
<script src="icons.js"></script><script src="kit.js"></script>
</body></html>
